services:
  verifier-backend:
    build:
      context: .
      dockerfile: src/apps/verifier-demo/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3004"
      MITCH_TRUST_MODE: "${MITCH_TRUST_MODE:-live}"
      MITCH_TSL_URL: "${MITCH_TSL_URL:-https://trust.mitch.demo/v1/eudi-lotl.json}"
      VERIFIER_BASE_URL: "${MITCH_VERIFIER_API_URL:-http://api.localhost/verifier}"
    ports:
      - "${MITCH_VERIFIER_BACKEND_PORT:-3004}:3004"
    networks:
      - mitch-network
    restart: unless-stopped

  issuer-mock:
    build:
      context: .
      dockerfile: src/apps/issuer-mock/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3005"
      ISSUER_BASE_URL: "${MITCH_ISSUER_URL:-http://api.localhost/issuer}"
      ISSUER_DID: "${MITCH_ISSUER_DID:-did:web:issuer.localhost}"
      CORS_ORIGINS: "${MITCH_CORS_ORIGINS:-http://wallet.localhost,http://verifier.localhost,http://localhost:5174,http://localhost:5175}"
    ports:
      - "${MITCH_ISSUER_PORT:-3005}:3005"
    networks:
      - mitch-network
    restart: unless-stopped

  wallet-pwa:
    build:
      context: .
      dockerfile: src/apps/wallet-pwa/Dockerfile
      args:
        VITE_VERIFIER_URL: "${MITCH_VERIFIER_PRESENT_URL:-http://api.localhost/verifier/present}"
        VITE_ISSUER_URL: "${MITCH_ISSUER_CREDENTIAL_URL:-http://api.localhost/issuer/credential}"
        VITE_ISSUER_DID: "${MITCH_ISSUER_DID:-did:web:issuer.localhost}"
    ports:
      - "${MITCH_WALLET_PORT:-5174}:8080"
    networks:
      - mitch-network
    restart: unless-stopped

  verifier-frontend:
    build:
      context: .
      dockerfile: src/apps/verifier-demo/frontend/Dockerfile
      args:
        VITE_VERIFIER_BACKEND_URL: "${MITCH_VERIFIER_API_URL:-http://api.localhost/verifier}"
        VITE_WALLET_URL: "${MITCH_WALLET_URL:-http://wallet.localhost}"
    ports:
      - "${MITCH_VERIFIER_FRONTEND_PORT:-5175}:8080"
    networks:
      - mitch-network
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      - verifier-backend
      - issuer-mock
      - wallet-pwa
      - verifier-frontend
    environment:
      MITCH_API_SITE: "${MITCH_API_SITE:-http://api.localhost}"
      MITCH_ISSUER_SITE: "${MITCH_ISSUER_SITE:-http://issuer.localhost}"
      MITCH_VERIFIER_SITE: "${MITCH_VERIFIER_SITE:-http://verifier.localhost}"
      MITCH_WALLET_SITE: "${MITCH_WALLET_SITE:-http://wallet.localhost}"
    ports:
      - "${MITCH_HTTP_PORT:-80}:80"
      - "${MITCH_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mitch-proxy-data:/data
      - mitch-proxy-config:/config
    networks:
      - mitch-network
    restart: unless-stopped

networks:
  mitch-network:
    driver: bridge

volumes:
  mitch-proxy-data:
  mitch-proxy-config:
