name: ci-security

on:
  push:
    branches: ["master", "main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Audit gate regression tests
        run: node --test scripts/check-security-audit.test.mjs

      - name: Enforce critical dependency audit gate
        shell: bash
        run: |
          audit_report="${{ runner.temp }}/askmi-dependency-audit.json"
          if pnpm audit --json > "$audit_report"; then
            audit_status=0
          else
            audit_status=$?
          fi
          node scripts/check-security-audit.mjs "$audit_report" "$audit_status"
