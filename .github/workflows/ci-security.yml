name: ci-security

on:
  push:
    branches: ["master", "main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit gate regression tests
        run: node --test scripts/check-security-audit.test.mjs

      - name: Toolchain pin checks
        run: node --test scripts/check-toolchain-pins.test.mjs

      - name: Enforce high/critical dependency audit gate
        shell: bash
        run: |
          audit_report="${{ runner.temp }}/askmi-dependency-audit.json"
          if pnpm audit --json > "$audit_report"; then
            audit_status=0
          else
            audit_status=$?
          fi
          # Production-only report: a time-boxed exception in
          # scripts/security-audit-exceptions.json applies only if the advisory
          # does not reach runtime dependencies.
          prod_report="${{ runner.temp }}/askmi-dependency-audit-prod.json"
          if pnpm audit --prod --json > "$prod_report"; then
            prod_status=0
          else
            prod_status=$?
          fi
          node scripts/check-security-audit.mjs "$audit_report" "$audit_status" "$prod_report" "$prod_status"
