<svg width="340" height="200" viewBox="0 0 340 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="200" rx="12" fill="url(#card_gradient)" />
  <rect x="20" y="20" width="60" height="60" rx="30" fill="white" fill-opacity="0.18" />
  <text x="40" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="white">ID</text>
  <text x="100" y="45" font-family="sans-serif" font-size="18" font-weight="700" fill="white">{{credentialName}}</text>
  <text x="100" y="66" font-family="sans-serif" font-size="12" fill="#cbd5e1">{{issuerName}}</text>
  <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#cbd5e1">HOLDER</text>
  <text x="20" y="142" font-family="sans-serif" font-size="14" fill="white">{{given_name}} {{family_name}}</text>
  <text x="220" y="120" font-family="sans-serif" font-size="10" fill="#cbd5e1">STATUS</text>
  <text x="220" y="142" font-family="sans-serif" font-size="14" fill="#86efac">VALID</text>
  <defs>
    <linearGradient id="card_gradient" x1="0" y1="0" x2="340" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
  </defs>
</svg>
