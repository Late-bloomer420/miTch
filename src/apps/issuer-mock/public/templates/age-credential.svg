<svg width="340" height="200" viewBox="0 0 340 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="200" rx="12" fill="url(#paint0_linear_mitch)"/>
  <rect x="20" y="20" width="60" height="60" rx="30" fill="white" fill-opacity="0.2"/>
  <text x="30" y="58" font-family="sans-serif" font-size="32" fill="white">🪪</text>
  
  <text x="100" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">
    {{credentialName}}
  </text>
  <text x="100" y="65" font-family="sans-serif" font-size="12" fill="#94A3B8">
    {{issuerName}}
  </text>

  <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#94A3B8" text-transform="uppercase">Holder</text>
  <text x="20" y="140" font-family="sans-serif" font-size="14" fill="white">{{given_name}} {{family_name}}</text>

  <text x="220" y="120" font-family="sans-serif" font-size="10" fill="#94A3B8" text-transform="uppercase">Status</text>
  <text x="220" y="140" font-family="sans-serif" font-size="14" fill="#10B981">● VALID</text>

  <defs>
    <linearGradient id="paint0_linear_mitch" x1="0" y1="0" x2="340" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
</svg>
